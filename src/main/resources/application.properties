spring.application.name=SpringJWTSimpleDemo



# Enable ANSI colored console output
spring.output.ansi.enabled=ALWAYS
# Trace-level logging for Spring Security (very verbose - shows filter chain, auth decisions, etc.)
logging.level.org.springframework.security=TRACE

# Colorful, readable console log pattern
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level) %clr([%thread]){magenta} %clr(%logger{36}){cyan} - %msg%n


spring.datasource.url=jdbc:mysql://localhost:3306/security
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always